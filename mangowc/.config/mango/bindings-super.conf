# Bindings using SUPER (Left Win) as modifier

#####################
### DEFAULT MODE ####
#####################

keymode=default

# Core actions
bind=SUPER,q,killclient
bind=SUPER,e,spawn,dolphin
bind=SUPER,r,spawn,wofi --show drun
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,v,togglefloating
bind=SUPER+ALT,q,quit

# Scratchpad
bind=SUPER,s,toggle_scratchpad
bind=SUPER+SHIFT,s,minimized
bind=SUPER+SHIFT,i,restore_minimized

# Move focus with SUPER + arrow keys
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Switch tags with SUPER + [0-9]
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

# Move active window to a tag with SUPER + SHIFT + [0-9]
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# Layout toggle
bind=SUPER,j,setlayout,tile
bind=SUPER,p,setlayout,monocle

# Config reload
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,g,toggleglobal

#####################
### DMS BINDINGS ####
#####################

bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,v,spawn,dms ipc call clipboard toggle
bind=SUPER,m,spawn,dms ipc call processlist focusOrToggle
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER,y,spawn,dms ipc call dankdash wallpaper
bind=SUPER+ALT,l,spawn,dms ipc call lock lock

#####################
### SCREENSHOT ######
#####################

# Region screenshot → clipboard
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
# Full screenshot → ~/Pictures (handled by DMS: Print → flameshot gui)
# Region screenshot → ~/Pictures
bind=SUPER,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

#####################
### COLOR PICKER ####
#####################

# Pick color → clipboard (hex)
bind=SUPER+SHIFT,c,spawn,hyprpicker -a

#####################
### MEDIA KEYS ######
#####################

# Volume (via DMS)
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness (via DMS)
bindl=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5
bindl=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5

# Media playback
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

#####################
### MOUSE BINDINGS ##
#####################

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
