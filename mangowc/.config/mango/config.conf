# #######################################################################################
# MANGOWC CONFIG
# #######################################################################################

################
### MONITORS ###
################

# Format: monitorrule=name,mfact,nmaster,layout,transform,scale,x,y,width,height,refreshrate
monitorrule=make:BOE,model:0x0AC9,width:2240,height:1400,refresh:60,x:0,y:0
#monitorrule=DP-3,0.55,1,tile,0,1,2240,0,3440,1400,60,width:2240,height:1400
monitorrule=make:HP Inc.,model:HP E27u G5,width:2240,height:1440,refresh:60,x:0,y:-1440
#############################
### ENVIRONMENT VARIABLES ###
#############################

env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,gtk3
env=XMODIFIERS,@im=fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx

#####################
### LOOK AND FEEL ###
#####################

gappih=5
gappiv=5
gappoh=5
gappov=5

borderpx=0
border_radius=12

focuscolor=0xff33ccff
bordercolor=0xaa595959

blur=1
blur_params_radius=3
blur_optimized=1

shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=15


#############
### INPUT ###
#############

repeat_rate=60
repeat_delay=250
trackpad_natural_scrolling=0
tap_and_drag=0
drag_lock=0
accel_speed=0.0
cursor_size=24

###################
### KEYBINDINGS ###
###################

source=~/.config/mango/bindings-super.conf
source=~/.config/mango/dms/colors.conf
source=~/.config/mango/dms/layout.conf
source=~/.config/mango/dms/outputs.conf

enable_hotarea=0
#################
### TAG RULES ###
#################

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile

####################
### LAYER RULES ####
####################

layerrule=noanim:1,layer_name:^dms

####################
### WINDOW RULES ###
####################

# DMS windows float
windowrule=isfloating:1,appid:^org\.quickshell$

# GNOME apps - no borders
windowrule=isnoborder:1,appid:^org\.gnome\.

# Terminal - no borders
windowrule=isnoborder:1,appid:^kitty$

# Zoom - float
windowrule=isfloating:1,appid:^zoom$
windowrule=isfloating:1,appid:^us\.zoom\.Zoom$

# NoMachine - float
windowrule=isfloating:1,appid:^nxplayer$

# Google Meet / Hangouts (PWA via Chrome)
windowrule=isfloating:1,title:^Meet -
windowrule=isfloating:1,title:^Google Meet

# Custom app rules
windowrule=width:1200,height:900,appid:bambu-studio
windowrule=width:1200,height:900,appid:BambuStudio

#################
### AUTOSTART ###
#################

exec-once=kitty
#exec-once=nm-applet
#exec-once=blueman-applet
exec-once=gjs /usr/share/gnome-shell/extensions/gsconnect@andyholmes.github.io/service/daemon.js
exec-once=dms run
exec-once=wl-paste --type text --watch cliphist store
exec-once=swaybg -i ~/wallpaper.png
exec-once=firefox
exec-once=batsignal -w 20 -c 10 -d 5
#exec-once=/opt/expressvpn/bin/expressvpn-client
exec-once=trayscale --hide-window

# Screen sharing / portal support.
# The portal must be started by systemd, not launched by hand: it only claims
# org.freedesktop.portal.Desktop when activated through its unit. Starting
# mango-session.target pulls in graphical-session.target, which every portal
# unit is bound to -- without it they all fail with "dependency failed".
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once=systemctl --user start mango-session.target
exec-once=fcitx5 --replace -d
source = ./dms/binds.conf

