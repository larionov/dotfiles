# Media tree. One parent directory on one filesystem, so moves between the
# download area and the library stay atomic and hardlinks remain possible.
#
# Mode 2775 sets the setgid bit: every directory created underneath inherits
# the media group, which is what lets the three services write each other's
# files. Re-asserted on every boot.
d /mnt/arr                     2775 larionov media -
d /mnt/arr/media               2775 larionov media -
d /mnt/arr/media/tv            2775 larionov media -
d /mnt/arr/usenet              2775 larionov media -
d /mnt/arr/usenet/incomplete   2775 larionov media -
d /mnt/arr/usenet/complete     2775 larionov media -
d /mnt/arr/usenet/complete/tv  2775 larionov media -
