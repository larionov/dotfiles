# Shared group for the media stack, kept declarative so a pacman update
# cannot quietly drop the membership.
#
# The sonarr package already ships "g media -" and "m sonarr media" in
# /usr/lib/sysusers.d/sonarr.conf; the sabnzbd and jellyfin packages do not.
g media    -
m sonarr   media
m sabnzbd  media
m jellyfin media
